server {
    listen 80;
    server_name localhost;

    location /health {
        default_type application/json;
        return 200 '{"status": "running", "service": "web-server"}';
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>ResilienceAI Web Server</h1></body></html>';
    }
}
