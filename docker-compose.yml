services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resilience-backend
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=${MOCK_MODE:-true}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - DATABASE_URL=sqlite:///./incidents.db
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - web-server
      - app-database
      - backup-store

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resilience-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

  web-server:
    build:
      context: ./infra/web-server
      dockerfile: Dockerfile
    container_name: resilience-web-server
    restart: "no"
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  app-database:
    image: postgres:15-alpine
    container_name: resilience-database
    restart: "no"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=recovery_test
    volumes:
      - ./infra/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recovery_test"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  backup-store:
    build:
      context: ./infra/backup-store
      dockerfile: Dockerfile
    container_name: resilience-backup-store
    restart: "no"
    volumes:
      - backup_data:/backups
    healthcheck:
      test: ["CMD", "test", "-f", "/backups/web-server-backup-latest.tar.gz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    container_name: resilience-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - llm

volumes:
  backup_data:
  pg_data:
  ollama_data:
